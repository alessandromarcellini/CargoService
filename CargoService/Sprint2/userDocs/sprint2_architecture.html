<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cargoservice_sprint2 — logical architecture</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#fff;margin:24px}</style>
</head>
<body>

<svg width="100%" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="max-width:1200px">
	<defs>
		<marker id="arrB" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker>
		<marker id="arrR" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#cc2222"/></marker>
		<marker id="arrBl" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2244cc"/></marker>
		<marker id="arrM" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0269c"/></marker>
		<marker id="arrG" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#118833"/></marker>
	</defs>

	<!-- env -->
	<rect x="14" y="14" width="1172" height="742" rx="26" fill="#eaf2fb" stroke="#9db6cc" stroke-width="2"/>
	<text x="32" y="40" font-size="14" fill="#667">env</text>

	<!-- physical devices (hardware, outside the boundary) -->
	<text x="115" y="112" font-size="13" fill="#556" text-anchor="middle" font-style="italic">physical devices (hardware)</text>

	<rect x="38" y="150" width="155" height="74" rx="10" fill="#eef2f6" stroke="#7a8a99"/>
	<rect x="38" y="150" width="155" height="22" rx="10" fill="#d7e0e8" stroke="#7a8a99"/>
	<text x="115" y="166" font-size="14" font-weight="bold" text-anchor="middle">web GUI</text>
	<text x="115" y="192" font-size="12" text-anchor="middle">display + pushbutton</text>
	<text x="115" y="212" font-size="11" text-anchor="middle" fill="#889">answer &amp; hold view</text>

	<rect x="38" y="372" width="155" height="74" rx="10" fill="#eef2f6" stroke="#7a8a99"/>
	<rect x="38" y="372" width="155" height="22" rx="10" fill="#d7e0e8" stroke="#7a8a99"/>
	<text x="115" y="388" font-size="14" font-weight="bold" text-anchor="middle">sonar device</text>
	<text x="115" y="414" font-size="12" text-anchor="middle">PicoW firmware</text>
	<text x="115" y="434" font-size="11" text-anchor="middle" fill="#889">domain-agnostic</text>

	<rect x="38" y="560" width="155" height="74" rx="10" fill="#eef2f6" stroke="#7a8a99"/>
	<rect x="38" y="560" width="155" height="22" rx="10" fill="#d7e0e8" stroke="#7a8a99"/>
	<text x="115" y="576" font-size="14" font-weight="bold" text-anchor="middle">LED device</text>
	<text x="115" y="602" font-size="12" text-anchor="middle">engagement lamp</text>
	<text x="115" y="622" font-size="11" text-anchor="middle" fill="#889">blink on/off</text>

	<!-- MQTT broker: the physical boundary -->
	<rect x="252" y="120" width="118" height="518" rx="14" fill="#fff3d6" stroke="#c9a227" stroke-width="1.6"/>
	<text x="311" y="150" font-size="17" font-weight="bold" text-anchor="middle">MQTT</text>
	<text x="311" y="170" font-size="13" text-anchor="middle">broker</text>
	<text x="311" y="190" font-size="12" text-anchor="middle" fill="#7a5f10">Mosquitto :1883</text>
	<text x="311" y="628" font-size="11.5" text-anchor="middle" fill="#7a5f10" font-style="italic">physical boundary</text>

	<!-- ctxcargoservice: cargoservice + cargorobot + logic sonar co-located -->
	<rect x="448" y="120" width="474" height="518" rx="14" fill="#fdfcec" stroke="#999"/>
	<text x="464" y="146" font-size="19" font-weight="bold">ctxcargoservice</text>
	<text x="632" y="146" font-size="13" fill="#778">(localhost:8030)</text>

	<!-- ctxrobotsmart -->
	<rect x="985" y="175" width="178" height="150" rx="14" fill="#fdfcec" stroke="#999"/>
	<text x="1000" y="201" font-size="18" font-weight="bold">ctxrobotsmart</text>
	<text x="1000" y="219" font-size="12" fill="#778">(127.0.0.1:8020)</text>

	<!-- actor: cargoservice -->
	<circle cx="588" cy="250" r="36" fill="#ecd4ec" stroke="#666" stroke-width="1.5"/>
	<rect x="536" y="238" width="24" height="24" fill="#e0cce6" stroke="#666"/>
	<polygon points="612,200 586,208 612,216" fill="#e03030" stroke="#901010"/>
	<ellipse cx="588" cy="250" rx="15" ry="10" fill="none" stroke="#222" stroke-width="6" transform="rotate(-18 588 250)"/>
	<text x="588" y="314" font-size="18" text-anchor="middle">cargoservice</text>

	<!-- actor: cargorobot -->
	<circle cx="836" cy="250" r="36" fill="#ecd4ec" stroke="#666" stroke-width="1.5"/>
	<rect x="784" y="238" width="24" height="24" fill="#e0cce6" stroke="#666"/>
	<polygon points="860,200 834,208 860,216" fill="#e03030" stroke="#901010"/>
	<ellipse cx="836" cy="250" rx="15" ry="10" fill="none" stroke="#222" stroke-width="6" transform="rotate(-18 836 250)"/>
	<text x="836" y="314" font-size="18" text-anchor="middle">cargorobot</text>

	<!-- actor: logic sonar -->
	<circle cx="588" cy="500" r="35" fill="#ecd4ec" stroke="#666" stroke-width="1.5"/>
	<rect x="537" y="488" width="24" height="24" fill="#e0cce6" stroke="#666"/>
	<polygon points="611,451 585,459 611,467" fill="#e03030" stroke="#901010"/>
	<ellipse cx="588" cy="500" rx="14" ry="9" fill="none" stroke="#222" stroke-width="5" transform="rotate(-18 588 500)"/>
	<text x="588" y="562" font-size="17" text-anchor="middle">logic sonar</text>

	<!-- external actor: robotsmart -->
	<circle cx="1074" cy="250" r="36" fill="#ffe94d" stroke="#666" stroke-width="1.5"/>
	<rect x="1022" y="238" width="24" height="24" fill="#f5df6e" stroke="#666"/>
	<polygon points="1098,200 1072,208 1098,216" fill="#e03030" stroke="#901010"/>
	<ellipse cx="1074" cy="250" rx="15" ry="10" fill="none" stroke="#222" stroke-width="6" transform="rotate(-18 1074 250)"/>
	<text x="1074" y="314" font-size="15" text-anchor="middle">robotsmart (ext)</text>

	<!-- ===== device <-> broker (left of broker) ===== -->
	<!-- web GUI -> broker : load_request (qak) -->
	<line x1="193" y1="176" x2="250" y2="176" stroke="#c0269c" stroke-width="1.6" marker-end="url(#arrM)"/>
	<text x="221" y="169" font-size="10.5" text-anchor="middle" fill="#c0269c">load_request</text>
	<!-- broker -> web GUI : holdstatus (qak) -->
	<line x1="250" y1="200" x2="193" y2="200" stroke="#118833" stroke-width="1.6" marker-end="url(#arrG)"/>
	<text x="221" y="214" font-size="10.5" text-anchor="middle" fill="#118833">holdstatus</text>
	<!-- sonar device -> broker : sonar_data RAW -->
	<line x1="193" y1="408" x2="250" y2="408" stroke="#333" stroke-width="1.8" marker-end="url(#arrB)"/>
	<text x="221" y="401" font-size="10.5" text-anchor="middle" fill="#333">sonar_data</text>
	<!-- broker -> LED device : led_data RAW -->
	<line x1="250" y1="597" x2="193" y2="597" stroke="#333" stroke-width="1.8" marker-end="url(#arrB)"/>
	<text x="221" y="590" font-size="10.5" text-anchor="middle" fill="#333">led_data</text>

	<!-- ===== broker <-> cargoservice / logic sonar (right of broker) ===== -->
	<!-- broker -> cargoservice : load_requests (subscribe) -->
	<line x1="370" y1="212" x2="548" y2="238" stroke="#c0269c" stroke-width="1.6" marker-end="url(#arrM)"/>
	<text x="452" y="202" font-size="11" text-anchor="middle" fill="#c0269c">load_requests (qak msg)</text>
	<!-- cargoservice -> broker : hold_state (publish) -->
	<line x1="552" y1="262" x2="370" y2="248" stroke="#118833" stroke-width="1.6" marker-end="url(#arrG)"/>
	<text x="452" y="278" font-size="11" text-anchor="middle" fill="#118833">hold_state (qak msg)</text>
	<!-- cargoservice -> broker : led_data RAW publish -->
	<line x1="556" y1="284" x2="370" y2="330" stroke="#333" stroke-width="1.6" marker-end="url(#arrB)"/>
	<text x="452" y="322" font-size="10.5" text-anchor="middle" fill="#333">led_data (raw)</text>
	<!-- broker -> logic sonar : sonar_data RAW subscribe -->
	<line x1="370" y1="486" x2="552" y2="500" stroke="#333" stroke-width="1.6" marker-end="url(#arrB)"/>
	<text x="452" y="478" font-size="10.5" text-anchor="middle" fill="#333">sonar_data (raw)</text>

	<!-- ===== internal declared interactions ===== -->
	<!-- logic sonar -> cargoservice : container_detected / out_of_service (event) -->
	<line x1="573" y1="465" x2="573" y2="288" stroke="#cc2222" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrR)"/>
	<text x="464" y="372" font-size="11" text-anchor="start" fill="#cc2222">container_detected</text>
	<text x="464" y="388" font-size="11" text-anchor="start" fill="#cc2222">out_of_service</text>
	<text x="464" y="404" font-size="10" text-anchor="start" fill="#cc2222">(event)</text>
	<!-- cargoservice -> logic sonar : start/stop detection (dispatch) -->
	<line x1="603" y1="288" x2="603" y2="465" stroke="#2244cc" stroke-width="1.4" stroke-dasharray="2,3" marker-end="url(#arrBl)"/>
	<text x="614" y="378" font-size="11" text-anchor="start" fill="#2244cc">start_detection</text>
	<text x="614" y="394" font-size="11" text-anchor="start" fill="#2244cc">stop_detection</text>
	<text x="614" y="410" font-size="10" text-anchor="start" fill="#2244cc">(dispatch)</text>

	<!-- cargoservice -> cargorobot -->
	<line x1="624" y1="250" x2="800" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#arrB)"/>
	<text x="712" y="234" font-size="12" text-anchor="middle" fill="#c0269c">reachTarget</text>
	<text x="712" y="250" font-size="10.5" text-anchor="middle" fill="#118833">targetReached targetUnreachable</text>

	<!-- cargorobot -> robotsmart -->
	<line x1="872" y1="250" x2="1038" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#arrB)"/>
	<text x="955" y="234" font-size="12" text-anchor="middle" fill="#c0269c">moverobot</text>
	<text x="955" y="250" font-size="10" text-anchor="middle" fill="#118833">moverobotdone moverobotfailed</text>

	<!-- test-only note -->
	<text x="588" y="606" font-size="10.5" text-anchor="middle" fill="#888" font-style="italic">preset_hold: test controllability only (no get_hold pull channel)</text>

	<!-- legend -->
	<text x="985" y="360" font-size="12" font-weight="bold" fill="#333">Legend</text>
	<line x1="985" y1="378" x2="1015" y2="378" stroke="#333" stroke-width="1.8" marker-end="url(#arrB)"/>
	<text x="1021" y="382" font-size="11" fill="#333">RAW MQTT payload / request-reply</text>
	<line x1="985" y1="398" x2="1015" y2="398" stroke="#c0269c" stroke-width="1.6" marker-end="url(#arrM)"/>
	<text x="1021" y="402" font-size="11" fill="#333">qak msg / request verb</text>
	<line x1="985" y1="418" x2="1015" y2="418" stroke="#118833" stroke-width="1.6" marker-end="url(#arrG)"/>
	<text x="1021" y="422" font-size="11" fill="#333">qak msg / reply</text>
	<line x1="985" y1="438" x2="1015" y2="438" stroke="#cc2222" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrR)"/>
	<text x="1021" y="442" font-size="11" fill="#333">event (broadcast)</text>
	<line x1="985" y1="458" x2="1015" y2="458" stroke="#2244cc" stroke-width="1.4" stroke-dasharray="2,3" marker-end="url(#arrBl)"/>
	<text x="1021" y="462" font-size="11" fill="#333">dispatch (fire-and-forget)</text>

	<!-- caption -->
	<text x="600" y="726" font-size="18" text-anchor="middle" fill="#333">cargoservice_sprint2 &mdash; logical architecture (MQTT deployment boundary)</text>
</svg>

</body>
</html>
